<!DOCTYPE html>
<html>
<head>
    <title>Change Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="content">

<div class="card" style="max-width:450px;margin:auto;margin-top:40px;">

<h2 style="text-align:center;">Change Password</h2>

{% if error %}
<p style="color:red;text-align:center;font-weight:bold;">{{ error }}</p>
{% endif %}

{% if success %}
<p style="color:green;text-align:center;font-weight:bold;">{{ success }}</p>
{% endif %}

<form method="POST">

<div class="password-field">
    <input type="password" id="old_password" name="old_password" placeholder="Old Password" required>
    <span onclick="togglePassword('old_password')">👁</span>
</div>

<div class="password-field">
    <input type="password" id="new_password" name="new_password"
           placeholder="New Password"
           required onkeyup="checkStrength()">
    <span onclick="togglePassword('new_password')">👁</span>
    <small id="strength" class="feedback-text"></small>
</div>

<div class="password-field">
    <input type="password" id="confirm_password" name="confirm_password"
           placeholder="Confirm Password"
           required onkeyup="checkMatch()">
    <span onclick="togglePassword('confirm_password')">👁</span>
    <small id="match" class="feedback-text"></small>
</div>

<button class="btn btn-success" style="width:100%;">Update Password</button>

</form>


<br>

<a href="/dashboard">
<button class="btn btn-warning" style="width:100%;">Back to Dashboard</button>
</a>

</div>
</div>

<style>
.password-field {
    position: relative;
    margin-bottom: 15px;
}

.password-field input {
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

.password-field span {
    position: absolute;
    right: 10px;
    top: 8px;
    cursor: pointer;
}
</style>

<script>
function togglePassword(id) {
    var field = document.getElementById(id);
    field.type = field.type === "password" ? "text" : "password";
}

function checkStrength() {
    var password = document.getElementById("new_password").value;
    var strength = document.getElementById("strength");

    if (password.length < 8) {
        strength.innerHTML = "Weak (minimum 8 characters)";
        strength.style.color = "red";
        return;
    }

    var strongRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])/;

    if (strongRegex.test(password)) {
        strength.innerHTML = "Strong Password";
        strength.style.color = "green";
    } else {
        strength.innerHTML = "Medium (Use uppercase, lowercase & number)";
        strength.style.color = "orange";
    }
}

function checkMatch() {
    var pass = document.getElementById("new_password").value;
    var confirm = document.getElementById("confirm_password").value;
    var match = document.getElementById("match");

    if (pass === confirm) {
        match.innerHTML = "Passwords Match";
        match.style.color = "green";
    } else {
        match.innerHTML = "Passwords Do Not Match";
        match.style.color = "red";
    }
}
</script>

</body>
</html>
