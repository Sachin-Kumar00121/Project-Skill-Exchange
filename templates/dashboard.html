
<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</head>
<body>

<h2>Welcome {{ session['user_name'] }}</h2>
<p>Role: {{ session['role'] }}</p>

<hr>

{% if session['role'] == 'provider' %}

    <h3>Provider Panel</h3>

    <a href="/add-skill" style="display:inline-block;
          padding:8px 15px;
          background:#290fa0;
          color:rgb(255, 255, 255);
          border-radius:6px;
          text-decoration:none;">➕ Add Skill</a>
    <br><br>

    <a href="/my-skills" style="display:inline-block;
          padding:8px 15px;
          background:#290fa0;
          color:rgb(255, 255, 255);
          border-radius:6px;
          text-decoration:none;">📋 My Skills</a>
    <br><br>

    <a href="/provider-bookings" style="display:inline-block;
          padding:8px 15px;
          background:#290fa0;
          color:rgb(255, 255, 255);
          border-radius:6px;
          text-decoration:none;">📦 View Booking Requests</a>
    <br><br>

{% else %}

    <h3>User Panel</h3>
     
    <a href="/all-skills" style="display:inline-block;
          padding:8px 15px;
          background:#290fa0;
          color:rgb(255, 255, 255);
          border-radius:6px;
          text-decoration:none;" >🔎 Browse Services</a>
    <br><br>

    <a href="/my-bookings" style="display:inline-block;
          padding:8px 15px;
          background:#290fa0;
          color:rgb(255, 255, 255);
          border-radius:6px;
          text-decoration:none;">📦 My Bookings</a>
    <br><br>

    <a href="/my-feedbacks"  style="display:inline-block;
          padding:8px 15px;
          background:#290fa0;
          color:rgb(255, 255, 255);
          border-radius:6px;
          text-decoration:none;">⭐ My Feedbacks</a><br><br>
    <br><br>
{% endif %}

<hr>

<a href="/logout" style="display:inline-block;
          padding:8px 15px;
          background:#d80303d3;
          color:rgb(12, 12, 10);
          border-radius:6px;
          text-decoration:none;">🚪 Logout</a>

</body>
</html>
