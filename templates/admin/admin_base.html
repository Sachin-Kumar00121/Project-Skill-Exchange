<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Admin Panel{% endblock %}</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CORE DESIGN SYSTEM -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/core.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>

<body data-theme="light">

<!-- =========================
     SIDEBAR
========================= -->

<div class="admin-sidebar">

    <h2 class="logo">⚡ SkillX</h2>

    <a href="{{ url_for('admin_dashboard') }}" 
     class="{% if request.endpoint == 'admin_dashboard' %}active-link{% endif %}">
     📊 Dashboard</a>

    <a href="{{ url_for('admin_users') }}" 
    class="{% if request.endpoint == 'admin_users' %}active-link{% endif %}">
    👤 Users</a>

    <a href="{{ url_for('admin_providers') }}" 
    class="{% if request.endpoint == 'admin_providers' %}active-link{% endif %}">
    🛠 Providers</a>

    <a href="{{ url_for('admin_skills') }}" 
    class="{% if request.endpoint == 'admin_skills' %}active-link{% endif %}">
    📚 Skills</a>

    <a href="{{ url_for('admin_bookings') }}" 
    class="{% if request.endpoint == 'admin_bookings' %}active-link{% endif %}">
    📅 Bookings</a>

    <a href="{{ url_for('admin_reviews') }}" 
    class="{% if request.endpoint == 'admin_reviews' %}active-link{% endif %}">
    ⭐ Reviews</a>

    <a href="{{ url_for('admin_change_password') }}" 
    class="{% if request.endpoint == 'admin_change_password' %}active-link{% endif %}">
    🔒 Change Password</a>

    <a href="{{ url_for('admin_logout') }}" 
    class="{% if request.endpoint == 'admin_logout' %}active-link{% endif %}">
    🚪 Logout</a>

</div>

<!-- =========================
     MAIN CONTENT
========================= -->

<div class="admin-content">

    <div class="admin-topbar">
        <h1>{% block page_title %}{% endblock %}</h1>

        <button id="themeToggle" class="btn btn-warning">Toggle Theme</button>
    </div>

    <div class="admin-card">
        {% block content %}{% endblock %}
    </div>

</div>

<!-- CUSTOM CONFIRM MODAL -->
<div id="confirmModal" class="confirm-modal">
    <div class="confirm-box">
        <p id="confirmText">Are you sure?</p>

        <div class="confirm-actions">
            <button id="confirmYes" class="btn btn-danger">Yes</button>
            <button id="confirmNo" class="btn btn-primary">Cancel</button>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
<div id="toast" class="toast"></div>

</body>
</html>
