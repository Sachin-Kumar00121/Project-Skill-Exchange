{% extends "admin/admin_base.html" %}
{% block content %}

<h2>All Reviews</h2>

<div class="card">
<table class="admin-table">

<thead>
<tr>
    <th>User</th>
    <th>Skill</th>
    <th>Rating</th>
    <th>Comment</th>
</tr>
</thead>

<tbody>
{% for r in reviews %}
<tr>
    <td>{{ r.user_name }}</td>
    <td>{{ r.skill_name }}</td>
    <td>{{ r.rating }}</td>
    <td>{{ r.comment }}</td>
</tr>
{% endfor %}
</tbody>

</table>
</div>

<div style="margin-bottom:15px;">
    <a href="javascript:history.back()" class="btn btn-primary">← Back</a>
</div>
{% endblock %}
