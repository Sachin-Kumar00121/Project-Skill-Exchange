{% extends "admin/admin_base.html" %}
{% block content %}

<h2>All Bookings</h2>

<div class="filter-bar">
<form method="GET">

<input type="text" name="user" placeholder="User" value="{{ request.args.get('user','') }}">
<input type="text" name="provider" placeholder="Provider" value="{{ request.args.get('provider','') }}">
<input type="text" name="skill" placeholder="Skill" value="{{ request.args.get('skill','') }}">

<select name="status">
<option value="">All Status</option>
<option value="pending">Pending</option>
<option value="accepted">Accepted</option>
<option value="completed">Completed</option>
<option value="cancelled">Cancelled</option>
</select>

<button type="submit" class="btn btn-search" >Search</button>
<a href="{{ request.path }}" class="btn btn-danger " >Clear All</a>

</form>
</div>


<div class="card">
<table class="admin-table">

<thead>
<tr>
    <th>User</th>
    <th>Provider</th>
    <th>Skill</th>
    <th>Status</th>
</tr>
</thead>

<tbody>
{% for b in bookings %}
<tr>
    <td>{{ b.user_name }}</td>
    <td>{{ b.provider_name }}</td>
    <td>{{ b.skill_name }}</td>
    <td>{{ b.status }}</td>
</tr>
{% endfor %}
</tbody>

</table>
</div>

<div style="margin-top:20px;">
    <a href="javascript:history.back()" class="btn btn-primary">← Back</a>
</div>

{% endblock %}
