{% extends "base.html" %}

{% block title %}Edit Feedback - SkillX{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pages.css') }}">

<div class="page-wrapper center-wrapper">
    <div class="modern-card feedback-card">
        
        <div class="feedback-header">
            <h2><i class="fa-solid fa-pen-to-square icon-cyan"></i> Edit Feedback</h2>
        </div>

        <form method="POST">
            <div class="rating-section">
                <label>Update Rating</label>
                
                <div class="js-rating-widget" id="ratingWidgetParent">
                    {% set current_rating = feedback.rating | float %}
                    <input type="hidden" name="rating" id="ratingInput" value="{{ current_rating }}" required>
                    
                    {% for i in range(1, 6) %}
                    <div class="star-box">
                        <div class="click-half rating-trigger" data-val="{{ i - 0.5 }}"></div>
                        <div class="click-full rating-trigger" data-val="{{ i }}"></div>
                        
                        <i class="fa-solid fa-star star-gray"></i>
                        
                        <div class="star-gold-wrap" id="star-fill-{{ i }}">
                            <i class="fa-solid fa-star star-gold"></i>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>

            <div class="input-wrap mb-25">
                <label>Update Comment</label>
                <textarea name="comment" rows="4" required class="form-textarea">{{ feedback.comment }}</textarea>
            </div>

            <button type="submit" class="action-btn btn-primary full-width-btn">
                <i class="fa-solid fa-floppy-disk"></i> Save Changes
            </button>
            
            <div class="text-center mt-15">
                <a href="/my-feedbacks" class="action-btn btn-outline full-width-btn">Cancel</a>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        let finalRatingVal = 0;
        const ratingInput = document.getElementById('ratingInput');
        const widgetParent = document.getElementById('ratingWidgetParent');

        function renderStars(val) {
            for (let i = 1; i <= 5; i++) {
                let fillWrap = document.getElementById('star-fill-' + i);
                if (!fillWrap) continue;

                if (val >= i) {
                    fillWrap.style.width = '100%';
                } else if (val === i - 0.5) {
                    fillWrap.style.width = '50%';
                } else {
                    fillWrap.style.width = '0%';
                }
            }
        }

       
        if(ratingInput && ratingInput.value) {
            finalRatingVal = parseFloat(ratingInput.value);
            renderStars(finalRatingVal);
        }

        document.querySelectorAll('.rating-trigger').forEach(trigger => {
            let val = parseFloat(trigger.getAttribute('data-val'));
            
            trigger.addEventListener('click', function() {
                finalRatingVal = val;
                ratingInput.value = val;
                renderStars(val);
            });
            
            trigger.addEventListener('mouseover', function() {
                renderStars(val);
            });
        });

        if(widgetParent) {
            widgetParent.addEventListener('mouseout', function() {
                renderStars(finalRatingVal);
            });
        }
    });
</script>
{% endblock %}
