<!DOCTYPE html>
<html>
<head>
    <title>Edit Feedback</title>
</head>
<body>

<h2>Edit Feedback</h2>

<form method="POST">

    <label>Rating:</label>
    <select name="rating" required>
        {% for i in range(1,6) %}
            <option value="{{ i }}"
                {% if feedback.rating == i %}selected{% endif %}>
                {{ i }}
            </option>
        {% endfor %}
    </select>

    <br><br>

    <label>Comment:</label><br>
    <textarea name="comment" rows="4" cols="40" required>{{ feedback.comment }}</textarea>

    <br><br>

    <button type="submit"
            style="background:blue;color:white;padding:6px 12px;border:none;border-radius:5px;">
        Update
    </button>

</form>

<br>
<a href="/my-feedbacks">← Back</a>

</body>
</html>
